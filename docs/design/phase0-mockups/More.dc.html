<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    a { color: hsl(142 76% 28%); } a:hover { color: hsl(142 76% 22%); }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: hsl(45 15% 97%); color: hsl(145 30% 15%); position: relative; overflow: hidden; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;">

  <!-- Page header -->
  <div style="display: flex; align-items: center; padding: 12px 16px; background: hsl(0 0% 100%); border-bottom: 1px solid hsl(145 15% 88%);">
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px;">
      <div style="font-size: 18px; font-weight: 800;">More</div>
      <div style="font-size: 12px; color: hsl(145 20% 35%);">Everything else — one tap away</div>
    </div>
  </div>

  <div style="padding: 14px 16px 100px; display: flex; flex-direction: column; gap: 14px;">

    <!-- Grid: every destination one tap (was 4 levels of nested tabs) -->
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">

      <div style="background: hsl(0 0% 100%); border: 1px solid hsl(145 15% 88%); border-radius: 12px; min-height: 84px; display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: 14px; position: relative;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="hsl(142 76% 28%)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11.5 11.5 14 15 9.5"></path><rect x="4" y="4" width="16" height="17" rx="2"></rect></svg>
        <div style="display: flex; flex-direction: column;">
          <span style="font-size: 14px; font-weight: 700;">Approvals</span>
          <span style="font-size: 11px; color: hsl(145 20% 35%);">Mga Aprubasyon</span>
        </div>
        <span style="position: absolute; top: 10px; right: 10px; min-width: 20px; height: 20px; border-radius: 9999px; background: hsl(0 84% 60%); color: hsl(0 0% 100%); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 5px;">3</span>
      </div>

      <div style="background: hsl(0 0% 100%); border: 1px solid hsl(145 15% 88%); border-radius: 12px; min-height: 84px; display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: 14px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="hsl(142 76% 28%)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8.5" cy="8" r="3"></circle><circle cx="16" cy="9.5" r="2.4"></circle><path d="M3.5 19c.6-3.2 2.5-5 5-5s4.4 1.8 5 5z"></path><path d="M14.8 14.4c2 .3 3.4 1.8 3.9 4.6"></path></svg>
        <div style="display: flex; flex-direction: column;">
          <span style="font-size: 14px; font-weight: 700;">Cooperative</span>
          <span style="font-size: 11px; color: hsl(145 20% 35%);">Kooperatiba</span>
        </div>
      </div>

      <div style="background: hsl(0 0% 100%); border: 1px solid hsl(145 15% 88%); border-radius: 12px; min-height: 84px; display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: 14px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="hsl(142 76% 28%)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-6 9 6"></path><path d="M5 9v11M9.5 9v11M14.5 9v11M19 9v11"></path><path d="M3 20h18"></path></svg>
        <div style="display: flex; flex-direction: column;">
          <span style="font-size: 14px; font-weight: 700;">Government</span>
          <span style="font-size: 11px; color: hsl(145 20% 35%);">Feedback and programs</span>
        </div>
      </div>

      <div style="background: hsl(0 0% 100%); border: 1px solid hsl(145 15% 88%); border-radius: 12px; min-height: 84px; display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: 14px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="hsl(142 76% 28%)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l1 13H5z"></path><path d="M9 7a3 3 0 0 1 6 0"></path></svg>
        <div style="display: flex; flex-direction: column;">
          <span style="font-size: 14px; font-weight: 700;">Marketplace</span>
          <span style="font-size: 11px; color: hsl(145 20% 35%);">Palengke</span>
        </div>
      </div>

      <div style="background: hsl(0 0% 100%); border: 1px solid hsl(145 15% 88%); border-radius: 12px; min-height: 84px; display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: 14px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="hsl(142 76% 28%)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"></rect><path d="M3 10h11"></path><path d="m16 3-2 3h4z"></path><path d="M7 15h4"></path></svg>
        <div style="display: flex; flex-direction: column;">
          <span style="font-size: 14px; font-weight: 700;">Orders</span>
          <span style="font-size: 11px; color: hsl(145 20% 35%);">Mga Order</span>
        </div>
      </div>

      <div style="background: hsl(0 0% 100%); border: 1px solid hsl(145 15% 88%); border-radius: 12px; min-height: 84px; display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: 14px; position: relative;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="hsl(142 76% 28%)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H4l2.5-2.7A8 8 0 1 1 21 12z"></path></svg>
        <div style="display: flex; flex-direction: column;">
          <span style="font-size: 14px; font-weight: 700;">Messages</span>
          <span style="font-size: 11px; color: hsl(145 20% 35%);">Mga Mensahe</span>
        </div>
        <span style="position: absolute; top: 10px; right: 10px; min-width: 20px; height: 20px; border-radius: 9999px; background: hsl(0 84% 60%); color: hsl(0 0% 100%); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 5px;">1</span>
      </div>

      <div style="background: hsl(0 0% 100%); border: 1px solid hsl(145 15% 88%); border-radius: 12px; min-height: 84px; display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: 14px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="hsl(142 76% 28%)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4.5 21c.8-4 3.5-6.5 7.5-6.5s6.7 2.5 7.5 6.5z"></path></svg>
        <div style="display: flex; flex-direction: column;">
          <span style="font-size: 14px; font-weight: 700;">Profile</span>
          <span style="font-size: 11px; color: hsl(145 20% 35%);">Account and voice</span>
        </div>
      </div>

      <div style="background: hsl(0 0% 100%); border: 1px solid hsl(145 15% 88%); border-radius: 12px; min-height: 84px; display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: 14px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="hsl(142 76% 28%)" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 12h2M10 12h10M4 17h13M20 17h.5"></path><circle cx="16" cy="7" r="2"></circle><circle cx="7" cy="12" r="2"></circle><circle cx="19" cy="17" r="2"></circle></svg>
        <div style="display: flex; flex-direction: column;">
          <span style="font-size: 14px; font-weight: 700;">Settings</span>
          <span style="font-size: 11px; color: hsl(145 20% 35%);">Farm and approval rules</span>
        </div>
      </div>
    </div>

    <!-- Sign out -->
    <div style="min-height: 52px; display: flex; align-items: center; justify-content: center; gap: 8px; background: hsl(0 0% 100%); border: 1px solid hsl(145 15% 88%); border-radius: 12px; color: hsl(0 84% 60%); font-size: 14px; font-weight: 700;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="m16 17 5-5-5-5"></path><path d="M21 12H9"></path></svg>
      Sign out
    </div>
  </div>

  <!-- Bottom nav: Iba Pa active -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: hsl(0 0% 100%); border-top: 1px solid hsl(145 15% 88%); display: flex; padding: 6px 4px 16px;">
    <div style="flex: 1 1 0; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: hsl(145 20% 35%);">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg>
      <span style="font-size: 11px; font-weight: 600;">Home</span>
    </div>
    <div style="flex: 1 1 0; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: hsl(145 20% 35%);">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 6C3 6 2 5 2 3.5c1.5 0 2.6.6 3 1.6M19.5 6C21 6 22 5 22 3.5c-1.5 0-2.6.6-3 1.6"></path><path d="M7 7h10l1.6 6.2A3 3 0 0 1 15.7 17H8.3a3 3 0 0 1-2.9-3.8z"></path><ellipse cx="12" cy="19" rx="3.4" ry="2.2"></ellipse></svg>
      <span style="font-size: 11px; font-weight: 600;">Animals</span>
    </div>
    <div style="flex: 1 1 0; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: hsl(145 20% 35%);">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"></rect><path d="M9 4V3h6v1"></path><path d="M9 10h6M9 14h6M9 18h3"></path></svg>
      <span style="font-size: 11px; font-weight: 600;">Ops</span>
    </div>
    <div style="flex: 1 1 0; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: hsl(145 20% 35%);">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"></rect><path d="M3 10h18"></path><path d="M7 15h4"></path></svg>
      <span style="font-size: 11px; font-weight: 600;">Money</span>
    </div>
    <div style="flex: 1 1 0; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: hsl(142 76% 28%); position: relative;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg>
      <span style="font-size: 11px; font-weight: 700;">More</span>
      <span style="position: absolute; top: 2px; right: 22px; min-width: 15px; height: 15px; border-radius: 9999px; background: hsl(0 84% 60%); color: hsl(0 0% 100%); font-size: 9px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 3px;">4</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
