<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    a { color: hsl(142 76% 28%); } a:hover { color: hsl(142 76% 22%); }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: hsl(45 15% 97%); color: hsl(145 30% 15%); position: relative; overflow: hidden; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;">

  <!-- Dim backdrop -->
  <div style="position: absolute; inset: 0; background: hsl(145 30% 15% / 0.45);"></div>

  <!-- Bottom sheet: the ONE milk recording surface -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: hsl(0 0% 100%); border-radius: 20px 20px 0 0; box-shadow: 0 -8px 24px hsl(145 30% 15% / 0.15); display: flex; flex-direction: column; max-height: 720px;">

    <div style="display: flex; justify-content: center; padding: 10px 0 2px;">
      <div style="width: 40px; height: 5px; border-radius: 9999px; background: hsl(145 15% 88%);"></div>
    </div>

    <!-- Sheet header -->
    <div style="display: flex; align-items: center; gap: 10px; padding: 8px 20px 12px;">
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px;">
        <div style="font-size: 18px; font-weight: 800;">Record Milk</div>
        <div style="font-size: 12px; color: hsl(145 20% 35%);">Mag-record ng gatas</div>
      </div>
      <div style="width: 48px; height: 48px; border-radius: 9999px; background: hsl(142 45% 92%); display: flex; align-items: center; justify-content: center;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="hsl(142 76% 28%)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 10a7 7 0 0 0 14 0"></path><path d="M12 19v3"></path></svg>
      </div>
    </div>

    <!-- Fields -->
    <div style="padding: 0 20px; display: flex; flex-direction: column; gap: 14px;">

      <!-- Animal chip -->
      <div style="display: flex; align-items: center; gap: 10px; background: hsl(45 15% 95%); border-radius: 12px; padding: 10px 14px;">
        <div style="width: 36px; height: 36px; border-radius: 9999px; background: hsl(142 45% 92%); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: hsl(142 76% 28%);">B</div>
        <div style="flex-grow: 1; display: flex; flex-direction: column;">
          <div style="font-size: 14px; font-weight: 700;">Bella</div>
          <div style="font-size: 11px; color: hsl(145 20% 35%); font-family: ui-monospace, monospace;">#A-102</div>
        </div>
        <span style="min-height: 44px; display: inline-flex; align-items: center; padding: 0 10px; margin: -10px -10px -10px 0; font-size: 12px; color: hsl(142 76% 28%); font-weight: 700;">Change</span>
      </div>

      <!-- Date -->
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="display: flex; align-items: baseline; gap: 6px;">
          <span style="font-size: 13px; font-weight: 700;">Date</span>
          <span style="font-size: 11px; color: hsl(145 20% 35%);">Petsa</span>
        </div>
        <div style="min-height: 48px; display: flex; align-items: center; gap: 10px; border: 1px solid hsl(145 15% 88%); border-radius: 12px; padding: 0 14px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="hsl(145 20% 35%)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M8 3v4M16 3v4M3 10h18"></path></svg>
          <span style="font-size: 14px; font-weight: 600;">Today — Aug 31, 2026</span>
        </div>
      </div>

      <!-- Session segmented -->
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="display: flex; align-items: baseline; gap: 6px;">
          <span style="font-size: 13px; font-weight: 700;">Session</span>
        </div>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border: 1px solid hsl(145 15% 88%); border-radius: 12px; overflow: hidden;">
          <div style="min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 6px; background: hsl(142 76% 28%); color: hsl(0 0% 100%); font-size: 14px; font-weight: 700;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2"></path></svg>
            AM
          </div>
          <div style="min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 6px; background: hsl(0 0% 100%); color: hsl(145 20% 35%); font-size: 14px; font-weight: 600; border-left: 1px solid hsl(145 15% 88%); border-right: 1px solid hsl(145 15% 88%);">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
            PM
          </div>
          <div style="min-height: 48px; display: flex; align-items: center; justify-content: center; background: hsl(0 0% 100%); color: hsl(145 20% 35%); font-size: 13px; font-weight: 600;">Full day</div>
        </div>
      </div>

      <!-- Liters -->
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="display: flex; align-items: baseline; gap: 6px;">
          <span style="font-size: 13px; font-weight: 700;">Liters</span>
          <span style="font-size: 11px; color: hsl(145 20% 35%);">Dami ng gatas</span>
        </div>
        <div style="min-height: 64px; display: flex; align-items: center; justify-content: space-between; border: 2px solid hsl(142 76% 28%); border-radius: 12px; padding: 0 18px;">
          <span style="font-size: 30px; font-weight: 800;">12.5</span>
          <span style="font-size: 16px; font-weight: 700; color: hsl(145 20% 35%);">L</span>
        </div>
      </div>

      <!-- Quality -->
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="display: flex; align-items: baseline; gap: 6px;">
          <span style="font-size: 13px; font-weight: 700;">Quality</span>
          <span style="font-size: 11px; color: hsl(145 20% 35%);">Kalidad</span>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
          <div style="min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 6px; background: hsl(142 45% 92%); border: 2px solid hsl(142 76% 28%); border-radius: 12px; font-size: 14px; font-weight: 700; color: hsl(142 76% 28%);">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"></path></svg>
            Good
          </div>
          <div style="min-height: 48px; display: flex; align-items: center; justify-content: center; background: hsl(0 0% 100%); border: 1px solid hsl(145 15% 88%); border-radius: 12px; font-size: 14px; font-weight: 600; color: hsl(145 20% 35%);">Rejected</div>
        </div>
      </div>
    </div>

    <!-- Pinned footer: never scrolls out of view -->
    <div style="display: flex; gap: 10px; padding: 16px 20px 24px; border-top: 1px solid hsl(145 15% 88%); margin-top: 16px;">
      <div style="flex: 1 1 0; min-height: 52px; display: flex; align-items: center; justify-content: center; border: 1px solid hsl(145 15% 88%); border-radius: 12px; font-size: 15px; font-weight: 700; color: hsl(145 20% 35%); background: hsl(0 0% 100%);">Cancel</div>
      <div style="flex: 2 1 0; min-height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 12px; font-size: 15px; font-weight: 700; color: hsl(0 0% 100%); background: hsl(142 76% 28%);">Save Milk</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
