<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    a { color: hsl(142 76% 28%); } a:hover { color: hsl(142 76% 22%); }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: hsl(45 15% 97%); color: hsl(145 30% 15%); position: relative; overflow: hidden; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;">

  <!-- Dim backdrop -->
  <div style="position: absolute; inset: 0; background: hsl(145 30% 15% / 0.45);"></div>

  <!-- SAME sheet, content swapped to success — no modal-over-modal -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: hsl(0 0% 100%); border-radius: 20px 20px 0 0; box-shadow: 0 -8px 24px hsl(145 30% 15% / 0.15); display: flex; flex-direction: column; max-height: 720px;">

    <div style="display: flex; justify-content: center; padding: 10px 0 2px;">
      <div style="width: 40px; height: 5px; border-radius: 9999px; background: hsl(145 15% 88%);"></div>
    </div>

    <div style="padding: 20px 20px 8px; display: flex; flex-direction: column; align-items: center; gap: 14px;">
      <div style="width: 72px; height: 72px; border-radius: 9999px; background: hsl(142 45% 92%); display: flex; align-items: center; justify-content: center;">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="hsl(142 76% 28%)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 3px;">
        <div style="font-size: 20px; font-weight: 800;">Na-save ang gatas!</div>
        <div style="font-size: 13px; color: hsl(145 20% 35%);">Milk record saved</div>
      </div>

      <!-- Summary -->
      <div style="width: 100%; background: hsl(45 15% 95%); border-radius: 12px; padding: 14px 16px; display: flex; align-items: center; gap: 12px;">
        <div style="width: 40px; height: 40px; border-radius: 9999px; background: hsl(142 45% 92%); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; color: hsl(142 76% 28%);">B</div>
        <div style="flex-grow: 1; display: flex; flex-direction: column;">
          <div style="font-size: 15px; font-weight: 700;">Bella · 12.5 L</div>
          <div style="font-size: 12px; color: hsl(145 20% 35%);">AM session · Ngayon, 7:15</div>
        </div>
        <span style="display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: hsl(142 76% 28%); background: hsl(142 45% 92%); border-radius: 9999px; padding: 4px 10px;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"></path></svg>
          Na-sync
        </span>
      </div>

      <!-- Running total for the day -->
      <div style="width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 2px 4px;">
        <span style="font-size: 13px; color: hsl(145 20% 35%);">Kabuuan ngayong araw</span>
        <span style="font-size: 15px; font-weight: 800;">42.5 L</span>
      </div>
    </div>

    <!-- Actions in the SAME sheet -->
    <div style="display: flex; flex-direction: column; gap: 10px; padding: 12px 20px 24px;">
      <div style="min-height: 52px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid hsl(145 15% 88%); border-radius: 12px; font-size: 15px; font-weight: 700; color: hsl(142 76% 28%); background: hsl(0 0% 100%);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
        Mag-record pa ng iba
      </div>
      <div style="min-height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 12px; font-size: 15px; font-weight: 700; color: hsl(0 0% 100%); background: hsl(142 76% 28%);">Tapos na</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
