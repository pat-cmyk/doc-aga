// Top-level build file
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.0.1'
        classpath 'com.google.gms:google-services:4.4.2'
        // THIS LINE HAS BEEN UPDATED to the latest stable version for AGP 9+
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.0'
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// NOTE: capacitor-native-settings uses deprecated proguard-android.txt which AGP 9+ blocks.
// Patched via npm postinstall script (see package.json "postinstall").
